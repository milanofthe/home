<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Preload the character-grid font so the first grid measurement uses real
		     metrics — avoids the fallback->JetBrains Mono swap relayout on first load. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/jetbrains-mono-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!-- Page-specific tags (title, description, canonical, og/twitter)
		     come from the Seo component; only truly global head content
		     lives here. -->
		<meta name="author" content="Milan Rother" />
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0f0f0f" />
		<meta name="geo.region" content="DE-NI" />
		<meta name="geo.placename" content="Braunschweig" />

		<!-- JSON-LD Structured Data -->
		<script type="application/ld+json">

						"https://orcid.org/0009-0006-5964-6115"
					]

						"@type": "OfferCatalog",

							{
								"@type": "Offer",

									"@type": "Service",
									"name": "Model Development",
									"description": "Mathematical model formulation, system identification, and parameter estimation"

								}

							{

		%sveltekit.head%

	<body data-sveltekit-preload-data="hover" class="bg-charcoal text-cream antialiased">

		<!-- whatsmytraffic Analytics -->

		     booking_open and booking_confirmed into the analytics. -->
